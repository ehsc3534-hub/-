name: Quiz Shorts Auto

on:
  schedule:
    # Bangladesh time (UTC+6) -> UTC
    - cron: "0 0 * * *"    # 06:00 AM
    - cron: "0 6 * * *"    # 12:00 PM
    - cron: "0 9 * * *"    # 03:00 PM
    - cron: "0 12 * * *"   # 06:00 PM
    - cron: "0 18 * * *"   # 12:00 AM
    - cron: "0 21 * * *"   # 03:00 AM
  workflow_dispatch:       # the "Run workflow" button
    inputs:
      dry_run:
        description: "Only make the video (no upload, no history save)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quiz-shorts
  cancel-in-progress: false

jobs:
  make-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OLLAMA_MODEL: qwen2.5:3b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng zstd fonts-dejavu-core fonts-comic-neue

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Cache models and assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama
            assets
          key: quiz-assets-qwen2.5-3b-v1

      - name: Voice and fallback font
        run: |
          mkdir -p assets
          [ -f assets/voice.onnx ] || curl -fL -o assets/voice.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx || true
          [ -f assets/voice.onnx.json ] || curl -fL -o assets/voice.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json || true
          [ -f assets/hand.ttf ] || curl -fL -o assets/hand.ttf https://github.com/google/fonts/raw/main/ofl/patrickhand/PatrickHand-Regular.ttf || true
          ls -la assets
          fc-list | grep -i comic || true

      - name: Install and start Ollama (local LLM)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (nohup ollama serve > ollama.log 2>&1 &) || true
          for i in $(seq 1 60); do curl -s http://127.0.0.1:11434/ > /dev/null && break; sleep 2; done
          ollama pull "$OLLAMA_MODEL"

      - name: Create and publish Short
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python main.py

      - name: Save question history (no repeats)
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "update history [skip ci]" && git pull --rebase --autostash && git push)

      - name: Keep test video (dry run only)
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: quiz-short
          path: out/quiz_short.mp4
          retention-days: 1
